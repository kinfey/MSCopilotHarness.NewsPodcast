<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1100" viewBox="0 0 1200 1100" role="img" aria-labelledby="title desc">
  <title id="title">新闻台从证据到声音的数据流</title>
  <desc id="desc">时段输入变成证据、事实简报、双语脚本、实际音轨、音频与目录，最终被网页读取。资料不足时经 Hosted 执行 WebIQ 补搜。发布受到审计与时长门禁约束，并按北京时间凌晨删除过期节目。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4678b8"/></marker>
    <style>
      text { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; fill: #20344e; }
      .title { font-size: 30px; font-weight: 700; }
      .heading { font-size: 22px; font-weight: 600; }
      .body { font-size: 18px; }
      .small { font-size: 15px; fill: #526477; }
      .data { fill: #eef6ff; stroke: #9bbfea; stroke-width: 1.5; }
      .edge { fill: none; stroke: #4678b8; stroke-width: 2; marker-end: url(#arrow); }
      .loop { stroke: #9266bd; stroke-dasharray: 7 5; }
    </style>
  </defs>
  <rect width="1200" height="1100" rx="20" fill="#f8fbff"/>
  <text x="48" y="54" class="title">不是“让模型写一篇新闻”，而是让数据走完制作流程</text>
  <text x="48" y="91" class="body">蓝色节点是可保存、可检查的数据；紫色虚线是补搜回路。</text>
  <rect x="48" y="125" width="682" height="85" rx="16" class="data"/>
  <text x="72" y="159" class="heading">D01 · 时段与任务输入</text>
  <text x="72" y="189" class="body">slot + invocation_id → Hosted 幂等任务 / 恢复检查点</text>
  <path d="M389 210V250" class="edge"/>
  <rect x="48" y="250" width="682" height="95" rx="16" class="data"/>
  <text x="72" y="286" class="heading">D02 · 公开报道证据包</text>
  <text x="72" y="318" class="body">evidence.json · 证据 ID / 通讯社 / URL / 来源日期 / 可用事实</text>
  <path d="M389 345V390" class="edge"/>
  <rect x="48" y="390" width="682" height="100" rx="16" class="data"/>
  <text x="72" y="426" class="heading">D03 · 主题 → 已核验事实简报</text>
  <text x="72" y="458" class="body">topics.json → briefs.json · 主题顺序、引用、事实与资料缺口</text>
  <rect x="830" y="335" width="322" height="150" rx="16" fill="#f8f3ff" stroke="#bba2dc"/>
  <text x="850" y="371" class="heading">发现资料缺口？</text>
  <text x="850" y="403" class="body">expand_news → WebIQ</text>
  <text x="850" y="435" class="small">Hosted 执行；不在沙箱中检索</text>
  <text x="850" y="461" class="small">expanded-evidence.json 回到 D02</text>
  <path d="M730 440H830" class="edge loop"/>
  <path d="M830 365H790V297H730" class="edge loop"/>
  <text x="754" y="422" class="small">缺口</text>
  <path d="M389 490V535" class="edge"/>
  <rect x="48" y="535" width="682" height="100" rx="16" class="data"/>
  <text x="72" y="571" class="heading">D04 · 同一事实的中英文脚本</text>
  <text x="72" y="603" class="body">cn/script.json → en/script.json · 主持 / 台词 / topic_id / 引用</text>
  <rect x="830" y="535" width="322" height="200" rx="16" fill="#fff" stroke="#bfcee1"/>
  <text x="850" y="573" class="heading">发布门禁，不靠模型承诺</text>
  <text x="850" y="609" class="body">真实 task / shell 执行记录</text>
  <text x="850" y="641" class="body">引用、来源比例与结构校验</text>
  <text x="850" y="673" class="body">整期与板块均 ≤1,200 秒</text>
  <text x="850" y="705" class="body">两语言全部完成才公开</text>
  <path d="M389 635V680" class="edge"/>
  <rect x="48" y="680" width="682" height="100" rx="16" class="data"/>
  <text x="72" y="716" class="heading">D05 · 主持音轨 → 成品音频与实测时间轴</text>
  <text x="72" y="748" class="body">MAI WAV → Wei 1.25x → FFprobe / FFmpeg → AAC / MP4</text>
  <path d="M389 780V825" class="edge"/>
  <rect x="48" y="825" width="682" height="100" rx="16" class="data"/>
  <text x="72" y="861" class="heading">D06 · 双语公开成品与当天目录</text>
  <text x="72" y="893" class="body">media/cn|en/YYYYMMDD/HHMM.mp4 + 定时 / 手动节目目录</text>
  <rect x="830" y="825" width="322" height="200" rx="16" fill="#fffbf1" stroke="#e5c58d"/>
  <text x="850" y="862" class="heading">凌晨换班：00:00 北京时间</text>
  <text x="850" y="897" class="body">只保留当天，不是滚动 24 小时</text>
  <text x="850" y="931" class="body">删除前日目录与公开 / 私有文件</text>
  <text x="850" y="965" class="body">旧任务不得重建已过期内容</text>
  <text x="850" y="999" class="small">当天首期未就绪 → 等待，不播昨日</text>
  <path d="M730 879H830" class="edge"/>
  <path d="M389 925V970" class="edge"/>
  <rect x="48" y="970" width="682" height="75" rx="16" class="data"/>
  <text x="72" y="1001" class="heading">D07 · 网页播放器、新闻速览与可点击来源</text>
  <text x="72" y="1031" class="small">每 45 秒读目录 · 标题跳转实测音频位置 · 页面时间按用户时区显示</text>
  <text x="48" y="1080" class="small">Microsoft Copilot Harness 管理中间的编辑执行；Hosted 保留确定性的校验、音频制作、存储与跨日清理。</text>
</svg>
