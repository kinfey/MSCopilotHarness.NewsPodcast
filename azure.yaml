# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

infra:
    provider: microsoft.foundry
name: newsradio24
requiredVersions:
    azd: '>=1.37.0'
    extensions:
        azure.ai.agents: '>=1.0.0-beta.21'
        azure.ai.routines: '>=1.0.0-beta.10'
services:
    ai-project:
        endpoint: ${FOUNDRY_PROJECT_ENDPOINT}
        host: azure.ai.project
    newsradio24:
        container:
            resources:
                cpu: "2"
                memory: 4Gi
        description: Produce agency-balanced neutral bilingual China and international news with two MAI hosts, station greetings and sign-offs, targeted WebIQ source expansion, measured story timestamps, primary-source links and durable Blob publication.
        displayName: Meridian 24 News Radio
        docker:
            remoteBuild: true
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            EDITORIAL_AGENT_NAME: newsradio24-editor
            MAI_MODEL: MAI-Voice-2.1
            PYTHONUNBUFFERED: "1"
            SPEECH_KEY: ${SPEECH_KEY}
            SPEECH_REGION: ${SPEECH_REGION}
            STORAGE_ACCOUNT_URL: ${STORAGE_ACCOUNT_URL}
            STORAGE_CONNECTION_STRING: ${STORAGE_CONNECTION_STRING}
            WEBIQ_API_KEY: ${WEBIQ_API_KEY}
            WEBSITE_URL: ${WEBSITE_URL}
        host: azure.ai.agent
        kind: hosted
        language: docker
        name: newsradio24
        project: src/resilient-research
        protocols:
            - protocol: invocations
              version: 2.0.0
        uses:
            - ai-project
            - newsradio24-editor
    newsradio24-editor:
        $ref: ./agents/newsroom.yaml
        host: azure.ai.agent
        project: agents
        uses:
            - ai-project
    newsradio24-half-hour:
        action:
            agentName: newsradio24
            input:
                action: generate
            type: invoke_agent_invocations_api
        description: Generate and publish one bilingual broadcast every 30 minutes.
        enabled: true
        host: azure.ai.routine
        triggers:
            default:
                cronExpression: 0,30 * * * *
                timeZone: Asia/Shanghai
                type: schedule
        uses:
            - newsradio24
    newsradio24-midnight-cleanup:
        action:
            agentName: newsradio24
            input:
                action: cleanup
            type: invoke_agent_invocations_api
        description: Keep only the current Asia/Shanghai day's broadcasts, removing expired public and private Blob content.
        enabled: true
        host: azure.ai.routine
        triggers:
            default:
                cronExpression: 0 0 * * *
                timeZone: Asia/Shanghai
                type: schedule
        uses:
            - newsradio24
