[project]
name = "newsradio24"
version = "0.1.0"
description = "Durable bilingual news podcast station hosted in Microsoft Foundry."
requires-python = ">=3.12"
dependencies = [
    "azure-ai-agentserver-core==2.1.0",
    "azure-ai-agentserver-invocations==1.1.0",
    "azure-ai-projects==2.9.0",
    "azure-identity==1.25.3",
    "azure-storage-blob>=12.26,<13",
    "httpx>=0.28,<1",
    "openai>=3,<4",
    "pydantic>=2.11,<3",
    "python-dotenv>=1.1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1", "playwright>=1.55,<2"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
